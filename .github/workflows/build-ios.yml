name: Build iOS Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Xcode Project (Unsigned)
        run: |
          cd XcodeProject
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean archive -archivePath ./Unity-iPhone.xcarchive

      - name: Generate .ipa file
        run: |
          mkdir -p Payload
          cp -r XcodeProject/Unity-iPhone.xcarchive/Products/Applications/*.app Payload/
          zip -r AR_Practica6.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR_Practica6_iOS_Unsigned
          path: AR_Practica6.ipa
